<main class="main">
  <div class="content">
    <div class="weather">
      <h1>{{ title }} forecast</h1>
      <div class="forecast-details-form">
        <form>
          <mat-form-field>
            <mat-label>Choose city</mat-label>
            <mat-select [(ngModel)]="cityName" name="city" (selectionChange)="onSelectNewCity()">
              @for (city of cityList; track city) {
                <mat-option [value]="city">{{city}}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </form>
      </div>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Temp. (C)</th>
            <th>Temp. (F)</th>
            <th>Summary</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let forecast of forecasts; index as i;">
            <td>{{forecast.date}}</td>
              <td>{{forecast.temperatureC}}</td>
              <td>{{forecast.temperatureF}}</td>
              <td>{{forecast.summary}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<router-outlet></router-outlet>
